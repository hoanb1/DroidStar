name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android NDK r25b
      run: |
        yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Install Host Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        modules: 'qtmultimedia qtserialport'

    - name: Install Android Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia qtserialport'

    - name: Clone android_openssl
      run: |
        git clone https://github.com/KDAB/android_openssl.git android_openssl

    - name: Clean up incompatible Android SDK Platforms
      run: |
        rm -rf $ANDROID_SDK_ROOT/platforms/android-35*
        rm -rf $ANDROID_SDK_ROOT/platforms/android-36*

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-31 \
          -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
          -DQT_HOST_PATH=$Qt6_DIR/../gcc_64 \
          -DCMAKE_PREFIX_PATH=$Qt6_DIR \
          -DCMAKE_FIND_ROOT_PATH=$Qt6_DIR \
          -DCMAKE_BUILD_TYPE=Debug

    - name: Build Project
      run: |
        cmake --build build

    - name: Build APK Target
      run: |
        cmake --build build --target apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DroidStar-Android-APK
        path: build/**/*.apk
